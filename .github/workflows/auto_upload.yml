name: Auto generate and upload focus music

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch: {}

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: |
          pip install numpy Pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Generate music + video + thumbnail + metadata
        id: gen
        run: |
          python3 pipeline.py --minutes 30 --mood random > pipeline_output.txt
          cat pipeline_output.txt
          OUTDIR=$(grep "Tayyor! Hammasi shu papkada:" pipeline_output.txt | sed 's/.*papkada: //')
          echo "outdir=$OUTDIR" >> "$GITHUB_OUTPUT"

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 youtube_upload.py "${{ steps.gen.outputs.outdir }}" --privacy public
